<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Elegant line illustration: crown with sparkle rays (berry + gold strokes) -->
  <!-- crown band -->
  <path d="M90 168 L230 168" stroke="#B8506A" stroke-width="5"/>
  <path d="M90 182 L230 182" stroke="#B8506A" stroke-width="5"/>
  <!-- crown points -->
  <path d="M90 168 L82 104 L122 138 L160 88 L198 138 L238 104 L230 168 Z"
        stroke="#B8506A" stroke-width="5" fill="rgba(184,80,106,0.06)"/>
  <!-- jewels on the points -->
  <circle cx="82" cy="100" r="4.5" stroke="#D4AF37" stroke-width="4"/>
  <circle cx="160" cy="84" r="5" stroke="#D4AF37" stroke-width="4"/>
  <circle cx="238" cy="100" r="4.5" stroke="#D4AF37" stroke-width="4"/>
  <!-- center gem -->
  <path d="M160 128 L172 144 L160 160 L148 144 Z" stroke="#D4AF37" stroke-width="4" fill="rgba(212,175,55,0.12)"/>
  <!-- sparkle rays -->
  <path d="M160 20 L160 44" stroke="#D4AF37" stroke-width="4"/>
  <path d="M104 34 L118 54" stroke="#D4AF37" stroke-width="4"/>
  <path d="M216 34 L202 54" stroke="#D4AF37" stroke-width="4"/>
  <path d="M60 70 L82 84" stroke="#B8506A" stroke-width="4"/>
  <path d="M260 70 L238 84" stroke="#B8506A" stroke-width="4"/>
  <!-- four-point stars -->
  <path d="M52 140 L56 150 L66 154 L56 158 L52 168 L48 158 L38 154 L48 150 Z" fill="#D4AF37" stroke="none"/>
  <path d="M272 130 L275 138 L283 141 L275 144 L272 152 L269 144 L261 141 L269 138 Z" fill="#B8506A" stroke="none"/>
  <circle cx="96" cy="208" r="3" fill="#FFB3C6" stroke="none"/>
  <circle cx="224" cy="208" r="3" fill="#FFB3C6" stroke="none"/>
  <circle cx="160" cy="216" r="3.4" fill="#D4AF37" stroke="none"/>
</svg>
